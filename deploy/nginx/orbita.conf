# ОРБИТА — конфигурация виртуального хоста (HTTP → HTTPS, Let's Encrypt).
# Замените __DOMAIN__ на ваш домен, например:
#   sed 's/__DOMAIN__/orbita.example.com/g' deploy/nginx/orbita.conf | sudo tee /etc/nginx/sites-available/orbita >/dev/null
#   sudo ln -s /etc/nginx/sites-available/orbita /etc/nginx/sites-enabled/orbita
# Сертификат нужно получить до включения этого файла (см. docs/DEPLOY.md, шаг 3).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Продление сертификата: certbot --webroot -w /var/www/certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # На nginx 1.25.1+ "http2" в listen помечено устаревшим (только предупреждение).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:orbita_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # current — символическая ссылка на последнюю выкладку (переключает деплой).
    root /var/www/orbita/current;

    include snippets/orbita-site.conf;

    access_log /var/log/nginx/orbita.access.log;
    error_log  /var/log/nginx/orbita.error.log warn;
}
