# ОРБИТА — общая часть конфигурации сайта: заголовки, сжатие, кэш, маршруты.
# Подключается внутри server { } директивой: include snippets/orbita-site.conf;
# Установка: sudo cp deploy/nginx/orbita-site.conf /etc/nginx/snippets/orbita-site.conf

index index.html;
charset utf-8;
server_tokens off;

# Сайт статический: другие методы не нужны.
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

# --- Заголовки безопасности ---------------------------------------------------
# CSP строгий: на сайте нет инлайновых скриптов и стилей, нет внешних ресурсов.
# img-src data: нужен для скачивания паспорта в PNG (SVG рисуется на canvas).
# Тест tests/e2e/run.mjs с E2E_CSP=1 читает эту строку и проверяет сайт под ней.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# --- Сжатие -------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

# --- Маршруты и кэш -----------------------------------------------------------
# Имена файлов без хеша, поэтому html/js/css всегда перепроверяются (ETag → 304),
# а изображения кэшируются на сутки.

# Проверка живости для мониторинга и деплоя.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Файл с идентификатором выкладки создаёт CI (см. .github/workflows/deploy.yml).
location = /version.txt {
    default_type text/plain;
    expires -1;
}

# Скрытые файлы наружу не отдаём.
location ~ /\.(?!well-known) {
    return 404;
}

location /assets/ {
    try_files $uri =404;
    expires 1d;
}

location / {
    try_files $uri $uri/ =404;
    expires -1;
}
