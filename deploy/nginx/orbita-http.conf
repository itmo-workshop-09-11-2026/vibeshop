# ОРБИТА — вариант без домена и HTTPS (доступ по IP). Для боевого сайта используйте orbita.conf.
# Установка: sudo cp deploy/nginx/orbita-site.conf /etc/nginx/snippets/
#            sudo cp deploy/nginx/orbita-http.conf /etc/nginx/sites-available/orbita
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/orbita/current;
    include snippets/orbita-site.conf;

    access_log /var/log/nginx/orbita.access.log;
    error_log  /var/log/nginx/orbita.error.log warn;
}
