name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]   # для main тесты запускает deploy.yml
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Бэкенд — зависимости и тесты (pytest)
        run: |
          pip install -r backend/requirements-dev.txt
          (cd backend && python -m pytest -q)
      - name: Упаковка и HTTP
        run: |
          python tests/test_pack.py
          python tests/smoke.py
      - name: Собрать ZIP
        run: python main.py --pack
      - uses: actions/upload-artifact@v4
        with:
          name: orbita-site-zip
          path: shop.zip
          retention-days: 30
